<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#162019" />
    <title>A spilled pint — Hopnote</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 500px at 70% -10%, rgba(224, 162, 60, 0.12), transparent 60%), #121a15;
        color: #f5efe1;
        font-family: Manrope, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 46px;
        height: 46px;
        margin: 0 auto 28px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #e0a23c;
        color: #1b251e;
        font:
          700 20px Georgia,
          serif;
      }
      .code {
        font: 500 11px monospace;
        letter-spacing: 2px;
        color: #e0a23c;
        text-transform: uppercase;
      }
      h1 {
        font:
          600 clamp(32px, 6vw, 52px)/1.05 Georgia,
          serif;
        letter-spacing: -1.6px;
        margin: 14px 0 12px;
      }
      h1 em {
        color: #e0a23c;
        font-style: italic;
      }
      p {
        color: #a4b1a2;
        font-size: 14px;
        line-height: 1.7;
        max-width: 420px;
        margin: 0 auto 28px;
      }
      a {
        display: inline-block;
        padding: 13px 20px;
        border-radius: 9px;
        background: #e0a23c;
        color: #221606;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">hop</div>
      <p class="code">500 · A spilled pint</p>
      <h1>We lost the <em>plot.</em></h1>
      <p>
        Something went wrong on our side. Your tasting journal is safe on this device — give it another try.
      </p>
      <a href="/">Start over</a>
    </div>
  </body>
</html>
